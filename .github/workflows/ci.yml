name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Format check (fast, run once) ────────────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Linux ──────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfreetype-dev \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ── macOS ──────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Windows ────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Web (TypeScript) ───────────────────────────────
  # Catches drift between the Rust wire codec and the @ciri/codec TS
  # decoder: regenerates constants.ts + sm.json fixtures from the live
  # Rust source, fails if the committed copies disagree, then runs the
  # vitest suite (per-opcode units + Rust-generated round-trips).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate web constants + fixtures from Rust
        # Uses the same cross-platform Node helper contributors run
        # locally — keeps CI and developer flows in lockstep and
        # covers constants.ts + sm.json + lz4.json in one pass.
        working-directory: web
        run: node scripts/gen.mjs

      - name: Fail if committed copies drifted from Rust
        # Narrow to the generated paths only — `gen.mjs` writes
        # exactly these three files; any other under src/ is
        # hand-maintained source and must not trigger drift.
        run: |
          git -C . diff --exit-code -- \
            web/packages/ciri-codec/src/constants.ts \
            web/packages/ciri-codec/src/__fixtures__/sm.json \
            web/packages/ciri-codec/src/__fixtures__/lz4.json

      - name: Install + test
        working-directory: web
        run: |
          npm ci
          npm --workspaces --if-present run typecheck
          npm --workspaces --if-present run test
