[workspace]
resolver = "2"
members = [
    "crates/ciri",
    "crates/ciri-app",
    "crates/ciri-server",
    "crates/ciri-protocol",
    "crates/ciri-layout",
    "crates/ciri-anim",
    "crates/ciri-render",
    "crates/ciri-gpu",
    "crates/ciri-term",
    "crates/ciri-input",
    "crates/ciri-config",
    "crates/ciri-session",
    "crates/ciri-procinfo",
    "crates/ciri-plugin",
    "crates/ciri-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
ciri-app = { path = "crates/ciri-app" }
ciri-render = { path = "crates/ciri-render" }
ciri-gpu = { path = "crates/ciri-gpu" }
ciri-term = { path = "crates/ciri-term" }
ciri-layout = { path = "crates/ciri-layout" }
ciri-anim = { path = "crates/ciri-anim" }
ciri-protocol = { path = "crates/ciri-protocol" }
ciri-input = { path = "crates/ciri-input" }
ciri-config = { path = "crates/ciri-config" }
ciri-session = { path = "crates/ciri-session" }
ciri-procinfo = { path = "crates/ciri-procinfo" }
ciri-plugin = { path = "crates/ciri-plugin" }

# External
arboard = { version = "3", features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
dirs = "6"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
rmp-serde = "1"
bytes = "1"
crossbeam-channel = "0.5"
winit = "0.30"
blade-graphics = "0.7"
blade-macros = "0.3"
crossfont = "0.9"
fontdb = "0.16"
alacritty_terminal = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
base64 = "0.22"
winnow = "0.7"
percent-encoding = "2"
colorsys = "0.6"
rustybuzz = "0.18"
unicode-segmentation = "1.11"
freetype-rs = "0.36"
nix = { version = "0.29", features = ["term", "process", "fs", "signal"] }
libc = "0.2"
notify-rust = "4"

# Patched forks (l1nxy/*, branch: ciri-patches)
# winit: Windows 11 multi-monitor DPI fix + Wayland DnD (https://github.com/rust-windowing/winit/issues/4041)
# alacritty_terminal: ciri terminal integration patches
# vte: additional ANSI escape sequence support
[patch.crates-io]
winit = { git = "https://github.com/l1nxy/winit.git", branch = "ciri-patches" }
alacritty_terminal = { git = "https://github.com/l1nxy/alacritty.git", branch = "ciri-patches" }
vte = { git = "https://github.com/l1nxy/vte.git", branch = "ciri-patches" }

# Optimize deps even in dev mode for usable performance
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false
