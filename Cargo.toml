[workspace]
resolver = "2"
members = [
    "crates/ciri",
    "crates/ciri-server",
    "crates/ciri-protocol",
    "crates/ciri-layout",
    "crates/ciri-anim",
    "crates/ciri-render",
    "crates/ciri-term",
    "crates/ciri-input",
    "crates/ciri-config",
    "crates/ciri-session",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
ciri-render = { path = "crates/ciri-render" }
ciri-term = { path = "crates/ciri-term" }
ciri-layout = { path = "crates/ciri-layout" }
ciri-anim = { path = "crates/ciri-anim" }
ciri-protocol = { path = "crates/ciri-protocol" }
ciri-input = { path = "crates/ciri-input" }
ciri-config = { path = "crates/ciri-config" }
ciri-session = { path = "crates/ciri-session" }

# External
winit = "0.30"
wgpu = "23"
glyphon = "0.7"
alacritty_terminal = "0.24"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
nix = { version = "0.29", features = ["term", "process", "fs", "signal"] }
libc = "0.2"

# Optimize deps even in dev mode for usable performance
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
