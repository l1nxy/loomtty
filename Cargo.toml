[workspace]
resolver = "2"
members = [
    "crates/ciri",
    "crates/ciri-server",
    "crates/ciri-protocol",
    "crates/ciri-layout",
    "crates/ciri-anim",
    "crates/ciri-render",
    "crates/ciri-gpu",
    "crates/ciri-term",
    "crates/ciri-input",
    "crates/ciri-config",
    "crates/ciri-session",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
ciri-render = { path = "crates/ciri-render" }
ciri-gpu = { path = "crates/ciri-gpu" }
ciri-term = { path = "crates/ciri-term" }
ciri-layout = { path = "crates/ciri-layout" }
ciri-anim = { path = "crates/ciri-anim" }
ciri-protocol = { path = "crates/ciri-protocol" }
ciri-input = { path = "crates/ciri-input" }
ciri-config = { path = "crates/ciri-config" }
ciri-session = { path = "crates/ciri-session" }

# External
arboard = { version = "3", features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
dirs = "6"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
rmp-serde = "1"
bytes = "1"
crossbeam-channel = "0.5"
winit = "0.30"
blade-graphics = "0.7"
blade-macros = "0.3"
crossfont = "0.9"
fontdb = "0.16"
alacritty_terminal = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
base64 = "0.22"
winnow = "0.7"
percent-encoding = "2"
rustybuzz = "0.18"
unicode-segmentation = "1.11"
freetype-rs = "0.36"
nix = { version = "0.29", features = ["term", "process", "fs", "signal"] }
libc = "0.2"

# Patch winit to fix Windows 11 multi-monitor DPI drag issue
# See: https://github.com/rust-windowing/winit/issues/4041
[patch.crates-io]
winit = { path = "patches/winit" }

# Optimize deps even in dev mode for usable performance
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = false
strip = true
lto = false
