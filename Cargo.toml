[workspace]
resolver = "2"
members = [
    "crates/loom",
    "crates/loom-app",
    "crates/loom-server",
    "crates/loom-protocol",
    "crates/loom-layout",
    "crates/loom-anim",
    "crates/loom-motion",
    "crates/loom-ui",
    "crates/loom-render",
    "crates/loom-gpu",
    "crates/loom-term",
    "crates/loom-input",
    "crates/loom-config",
    "crates/loom-session",
    "crates/loom-procinfo",
    "crates/loom-plugin",
    "crates/loom-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Internal crates
loom-app = { path = "crates/loom-app" }
loom-render = { path = "crates/loom-render" }
loom-gpu = { path = "crates/loom-gpu" }
loom-term = { path = "crates/loom-term" }
loom-layout = { path = "crates/loom-layout" }
loom-anim = { path = "crates/loom-anim" }
loom-motion = { path = "crates/loom-motion" }
loom-ui = { path = "crates/loom-ui" }
loom-protocol = { path = "crates/loom-protocol" }
loom-input = { path = "crates/loom-input" }
loom-config = { path = "crates/loom-config" }
loom-session = { path = "crates/loom-session" }
loom-procinfo = { path = "crates/loom-procinfo" }
loom-plugin = { path = "crates/loom-plugin" }

# External
arboard = { version = "3", features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
dirs = "6"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
rmp-serde = "1"
bytes = "1"
crossbeam-channel = "0.5"
smallvec = "1"
smol_str = "0.2"
winit = "0.30"
blade-graphics = "0.7"
blade-macros = "0.3"
crossfont = "0.9"
fontdb = "0.16"
alacritty_terminal = "0.25"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
base64 = "0.22"
winnow = "0.7"
percent-encoding = "2"
colorsys = "0.6"
rustybuzz = "0.20"
unicode-segmentation = "1.11"
taffy = "0.7"
freetype-rs = "0.36"
nix = { version = "0.29", features = ["term", "process", "fs", "signal"] }
libc = "0.2"
notify-rust = "4"
# TLS is intentionally NOT enabled here. The WS gateway in loom-server
# expects an upstream reverse proxy (caddy/nginx) to terminate TLS when
# bind != loopback. Enabling `native-tls` or `rustls-tls-*` here would
# add a server-side TLS code path that the gateway does not implement —
# bump features explicitly only if you also wire the cert plumbing.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
# Side-channel-resistant byte compare for token authentication.
subtle = { version = "2", default-features = false }
# Best-effort zeroing of the in-memory copy of the bearer token when
# the daemon shuts down or a per-connection clone is dropped. The
# `alloc` feature enables Zeroize for String/Vec.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# Patched forks (l1nxy/*, branch: loom-patches)
# winit: Windows 11 multi-monitor DPI fix + Wayland DnD (https://github.com/rust-windowing/winit/issues/4041)
# alacritty_terminal: loom terminal integration patches
# vte: additional ANSI escape sequence support
[patch.crates-io]
winit = { git = "https://github.com/l1nxy/winit.git", branch = "loom-patches" }
alacritty_terminal = { git = "https://github.com/l1nxy/alacritty.git", branch = "loom-patches" }
vte = { git = "https://github.com/l1nxy/vte.git", branch = "loom-patches" }

# Optimize deps even in dev mode for usable performance
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false
