# Ciri default configuration
# Copy to ~/.config/ciri/config.toml and customize.

[font]
family = "Google Sans Code NF"
size = 10.0

[appearance]
padding = 4.0
column_gap = 8.0
border_width = 2.0
active_border_color = "#528BFF"
inactive_border_color = "#3E4452"
inactive_opacity = 0.7

[appearance.focus_ring]
style = "solid"
glow_radius = 4.0
glow_layers = 3
dash_length = 8.0
gap_length = 4.0

[animation]
speed = 12.0
enabled = true
epsilon = 0.1
overview_zoom_fit = 0.9
zoom_threshold = 0.99
pane_open_style = "fade"
pane_open_duration_ms = 200
pane_close_duration_ms = 150
focus_transition_speed = 15.0

[window]
width = 1024.0
height = 768.0
title = "ciri"

[terminal]
default_cols = 80
default_rows = 24
cursor_color = "#528BFF"
cursor_opacity = 0.8
# Shell to spawn. Leave empty for platform default ($SHELL / getpwuid on Unix, cmd.exe on Windows).
shell = ""

[statusbar]
height_padding = 4.0
text_baseline = 0.8

[input]
# "prefix" = tmux-style (leader → one action → back to normal)
# "sticky" = zellij-style (leader → stay in mode until Esc)
mode = "prefix"
leader_timeout_ms = 1000
double_tap_window_ms = 300
scroll_multiplier = 50.0

[render]
frame_interval_ms = 16
atlas_size = 2048
max_glyph_instances = 32768
max_rectangles = 8192
frame_latency = 2
# GPU backend: "auto" (platform default), "gl", "vulkan", "dx"
# auto = GL on Linux, Metal on macOS, DX11 on Windows
backend = "auto"

[theme]
# Available presets: "ciri_dark", "one_dark", "catppuccin_mocha", "tokyo_night", "dracula", "nord", "gruvbox_dark", "ghostty"
# Set preset, then override individual colors below if needed.
preset = "ciri_dark"

[keys]
leader = "ctrl+w"

# Direct bindings: work without leader key (e.g. Ctrl+key to enter modes directly)
[keys.direct_bindings]
"ctrl+g" = "toggle_lock"

[keys.bindings]
n = "new_column_right"
d = "new_row_below"
x = "close_pane"
h = "focus_left"
l = "focus_right"
k = "focus_up"
j = "focus_down"
"Left" = "focus_left"
"Right" = "focus_right"
"Up" = "focus_up"
"Down" = "focus_down"
"shift+h" = "move_pane_left"
"shift+l" = "move_pane_right"
r = "enter_mode:resize"
s = "enter_mode:scroll"
m = "enter_mode:move"
f = "column_width_full"
b = "toggle_broadcast"
c = "consume_into_column"
e = "expel_from_column"
o = "toggle_overview"
tab = "toggle_overview"
q = "detach"
p = "toggle_command_palette"
g = "toggle_lock"
"/" = "toggle_help"

[keys.modes.resize]
h = "column_width_decrease"
l = "column_width_increase"
"[" = "column_width_decrease"
"]" = "column_width_increase"
r = "cycle_preset_width"
"shift+r" = "cycle_preset_width_reverse"
f = "column_width_full"
"=" = "equalize_adjacent_columns"

[keys.modes.scroll]
j = "scroll_line_down"
k = "scroll_line_up"
"Down" = "scroll_line_down"
"Up" = "scroll_line_up"
d = "scroll_half_page_down"
u = "scroll_half_page_up"
f = "scroll_page_down"
b = "scroll_page_up"
g = "scroll_top"
"shift+g" = "scroll_bottom"

[keys.modes.move]
h = "move_pane_left"
l = "move_pane_right"
"Left" = "move_pane_left"
"Right" = "move_pane_right"

[keys.overview_bindings]
h = "focus_left"
l = "focus_right"
j = "focus_down"
k = "focus_up"
x = "close_pane"
n = "new_column_right"
escape = "exit_overview"
enter = "exit_overview"
o = "exit_overview"
tab = "exit_overview"

[keys.direct_bindings]
"ctrl+g" = "toggle_lock"
"ctrl+shift+f" = "open_search"
"ctrl+shift+c" = "clipboard_copy"
"ctrl+shift+v" = "clipboard_paste"

[keys.search_bindings]
escape = "close_search"
enter = "search_next_match"
"shift+enter" = "search_prev_match"
backspace = "text_backspace"

[keys.palette_bindings]
escape = "close_command_palette"
up = "palette_up"
down = "palette_down"
enter = "palette_confirm"
backspace = "text_backspace"

[keys.paste_confirm_bindings]
enter = "confirm_paste"
y = "confirm_paste"
escape = "dismiss_paste_confirm"
n = "dismiss_paste_confirm"
