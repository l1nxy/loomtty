# Loom default configuration
# Copy to ~/.config/loom/config.toml and customize for loomtty.

[font]
family = "Google Sans Code NF"
size = 10.0

[appearance]
padding = 4.0
column_gap = 4.0
border_width = 2.0
active_border_color = "#528BFF"
inactive_border_color = "#3E4452"
inactive_opacity = 0.7
# Logical-pixel corner radius for panes (background, cell content, focus ring).
# 0.0 = classic sharp corners (default, no visual change on upgrade).
# Try 4-12 for modern soft. Niri-style alpha mask: no extra pass, opaque
# region preserved except at the four arc pixels.
pane_corner_radius = 0.0
# Optional global background image rendered behind everything (panes
# in normal mode, thumbnails in overview mode). PNG and JPEG; supports
# `~`, absolute paths, and paths relative to this config file's
# directory. Empty = use the solid `theme.overview_background` colour.
# Fitted with a `cover` policy (filled, overflow cropped, aspect kept).
background_image = ""
# 0.0 shows the wallpaper at full strength; 1.0 hides it entirely under
# `theme.overview_background`. Mid-values (~0.4-0.6) keep pane content
# legible over a busy photo. Ignored when no image is set.
background_dim = 0.0
# Pane background opacity. 1.0 = fully opaque (default, no visual change
# on upgrade). Lower values let `background_image` show through panes
# — try 0.8 with a wallpaper. Applies only to pane interior bgs;
# chrome (palette, status bar, etc.) stays opaque for legibility.
# Note: selection / cursor / search-highlight rects also dim with
# `pane_opacity`. ~0.7-0.9 keeps them visible; values below 0.5 fade
# them noticeably.
pane_opacity = 1.0

[appearance.focus_ring]
style = "solid"
glow_radius = 4.0
glow_layers = 3
dash_length = 8.0
gap_length = 4.0

[animation]
speed = 12.0
enabled = true
epsilon = 0.1
overview_zoom_fit = 0.9
zoom_threshold = 0.99
pane_open_style = "fade"
pane_open_duration_ms = 200
pane_close_duration_ms = 150
focus_transition_speed = 15.0

[window]
width = 1024.0
height = 768.0
title = "loomtty"

[terminal]
default_cols = 80
default_rows = 24
cursor_color = "#528BFF"
cursor_opacity = 0.8
# Shell to spawn. Leave empty for platform default ($SHELL / getpwuid on Unix, cmd.exe on Windows).
shell = ""

[statusbar]
height_padding = 4.0
text_baseline = 0.8

[input]
# "prefix" = tmux-style (leader → one action → back to normal)
# "sticky" = zellij-style (leader → stay in mode until Esc)
mode = "sticky"
leader_timeout_ms = 1000
double_tap_window_ms = 300
scroll_multiplier = 50.0

[render]
frame_interval_ms = 16
atlas_size = 2048
max_glyph_instances = 32768
max_rectangles = 8192
frame_latency = 2
# GPU backend: "auto" (platform default), "gl", "vulkan", "dx"
# auto = GL on Linux, Metal on macOS, DX11 on Windows
backend = "auto"
# Alpha blending mode: "native", "linear", "linear-corrected"
# native = sRGB-space blend (fast, slightly brighter text)
# linear = linear-light blend (correct, text may appear thinner)
# linear-corrected = linear + weight correction (recommended)
# Default: "linear-corrected" on Linux/Windows, "native" on macOS
alpha_blending = "linear-corrected"

[theme]
# Available presets: "loom_dark", "one_dark", "one_half_dark", "catppuccin_mocha", "tokyo_night", "dracula", "nord", "gruvbox_dark", "ghostty"
# Set preset, then override individual colors below if needed.
preset = "loom_dark"

[keys]
leader = "alt"

# Direct bindings: work without leader key (e.g. Ctrl+key to enter modes directly)
[keys.bindings]
n = "new_column_right"
d = "new_row_below"
"shift+d" = "new_tile_below"
x = "close_pane"
h = "focus_left"
l = "focus_right"
k = "focus_up"
j = "focus_down"
"Left" = "focus_left"
"Right" = "focus_right"
"Up" = "focus_up"
"Down" = "focus_down"
"shift+h" = "move_pane_left"
"shift+l" = "move_pane_right"
r = "enter_mode:resize"
s = "enter_mode:scroll"
m = "enter_mode:move"
f = "column_width_full"
b = "toggle_broadcast"
c = "consume_into_column"
e = "expel_from_column"
o = "toggle_overview"
q = "detach"
p = "toggle_command_palette"
"shift+p" = "toggle_session_palette"
i = "next_session"
"shift+i" = "prev_session"
"shift+n" = "new_session"
g = "toggle_lock"
"/" = "toggle_help"

[keys.modes.resize]
h = "column_width_decrease"
l = "column_width_increase"
"[" = "column_width_decrease"
"]" = "column_width_increase"
r = "cycle_preset_width"
"shift+r" = "cycle_preset_width_reverse"
f = "column_width_full"
"=" = "equalize_adjacent_columns"

[keys.modes.scroll]
j = "scroll_line_down"
k = "scroll_line_up"
"Down" = "scroll_line_down"
"Up" = "scroll_line_up"
d = "scroll_half_page_down"
u = "scroll_half_page_up"
f = "scroll_page_down"
b = "scroll_page_up"
g = "scroll_top"
"shift+g" = "scroll_bottom"
# Jump between OSC 133 prompt boundaries (requires shell integration).
"[" = "prev_prompt"
"]" = "next_prompt"

[keys.modes.move]
h = "move_pane_left"
l = "move_pane_right"
"Left" = "move_pane_left"
"Right" = "move_pane_right"

[keys.overview_bindings]
h = "focus_left"
l = "focus_right"
j = "focus_down"
k = "focus_up"
x = "close_pane"
n = "new_column_right"
escape = "exit_overview"
enter = "exit_overview"
o = "exit_overview"
tab = "exit_overview"

[keys.direct_bindings]
"ctrl+g" = "toggle_lock"
"ctrl+shift+f" = "open_search"
"ctrl+shift+c" = "clipboard_copy"
"ctrl+shift+v" = "clipboard_paste"

[keys.search_bindings]
escape = "close_search"
enter = "search_next_match"
"shift+enter" = "search_prev_match"
backspace = "text_backspace"

[keys.palette_bindings]
escape = "close_command_palette"
up = "palette_up"
down = "palette_down"
enter = "palette_confirm"
backspace = "text_backspace"

[keys.paste_confirm_bindings]
enter = "confirm_paste"
y = "confirm_paste"
escape = "dismiss_paste_confirm"
n = "dismiss_paste_confirm"

# Browser-facing web gateway. Disabled by default. When enabled, the
# daemon serves the browser terminal SPA over plain HTTP and upgrades
# `/ws` to the binary protocol — both on `port`, alongside the existing
# Unix/TCP listeners. The easiest way to turn this on is `loomtty web`,
# which enables it, mints a token, prints the URL, and runs the server.
# The gateway speaks plain http:// + ws:// — terminate TLS upstream
# (caddy/nginx) or use a tunnel if you point `bind` at a non-loopback
# address. Token must be at least 16 bytes; generate with `openssl rand
# -hex 16`.
[web]
enabled = false
# Empty string is the loopback placeholder — the daemon substitutes
# 127.0.0.1 at bind time. Matches WebConfig::default() so a config
# round-tripped through serde produces no diff.
bind = ""
port = 7891
# Generate with `openssl rand -hex 16` (32 hex chars) and paste the
# value between the quotes. Leave as "" while `enabled = false`.
# Avoid base64-style tokens for query-string clients: characters
# `+`, `;`, `=`, `&`, `%` must be percent-encoded by the client or
# they will silently truncate / mis-split the value. Hex tokens
# need no escaping.
# Do NOT ship the example below — it is a placeholder string that
# the schema validator rejects as too short / well-known.
# token = "REPLACE_WITH_OUTPUT_OF_openssl_rand_hex_16"
token = ""
# Exact-match Origin allowlist for browser clients (CSRF defense).
# Empty + loopback bind = permissive (fine for local dev). Empty +
# non-loopback bind = daemon refuses to start. Non-empty = each
# inbound upgrade's Origin header must match one of these entries.
# Examples: "http://localhost:5173", "https://terminal.example.com",
# or the literal "null" for file:// / sandboxed origins.
allowed_origins = []
# Directory the SPA is served from. Empty = `<server-exe-dir>/web` (next
# to the loomtty-server binary). Populate it with a built web bundle:
# `node web/scripts/install-assets.mjs`. These files are served WITHOUT
# the token (only `/ws` is authenticated), so put ONLY the public web
# bundle here — never secrets.
static_dir = ""
