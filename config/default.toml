# Ciri default configuration
# Copy to ~/.config/ciri/config.toml and customize.

[font]
family = "Google Sans Code NF"
size = 10.0

[appearance]
padding = 4.0
column_gap = 8.0
border_width = 2.0
active_border_color = "#528BFF"
inactive_border_color = "#3E4452"

[animation]
speed = 12.0
enabled = true
epsilon = 0.1
overview_zoom_fit = 0.9
zoom_threshold = 0.99

[window]
width = 1024.0
height = 768.0
title = "ciri"

[terminal]
default_cols = 80
default_rows = 24
cursor_color = "#528BFF"
cursor_opacity = 0.8
# Shell to spawn. Leave empty for platform default ($SHELL / getpwuid on Unix, cmd.exe on Windows).
shell = ""

[statusbar]
height_padding = 4.0
text_baseline = 0.8

[input]
leader_timeout_ms = 1000
double_tap_window_ms = 300
scroll_multiplier = 50.0

[render]
frame_interval_ms = 16
atlas_size = 2048
max_glyph_instances = 32768
max_rectangles = 8192
frame_latency = 2

[theme]
# Available presets: "one_dark", "catppuccin_mocha", "tokyo_night", "dracula", "nord", "gruvbox_dark"
# Set preset, then override individual colors below if needed.
preset = "one_dark"

[keys]
leader = "ctrl+w"

[keys.bindings]
n = "new_column_right"
d = "new_row_below"
x = "close_pane"
h = "focus_left"
l = "focus_right"
k = "focus_up"
j = "focus_down"
"shift+h" = "move_pane_left"
"shift+l" = "move_pane_right"
"[" = "column_width_decrease"
"]" = "column_width_increase"
f = "column_width_full"
e = "column_width_half"
o = "toggle_overview"
tab = "toggle_overview"

[keys.overview_bindings]
h = "focus_left"
l = "focus_right"
j = "focus_down"
k = "focus_up"
x = "close_pane"
n = "new_column_right"
escape = "exit_overview"
enter = "exit_overview"
o = "exit_overview"
tab = "exit_overview"
