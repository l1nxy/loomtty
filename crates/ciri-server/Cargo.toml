[package]
name = "ciritty-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ciritty-server"
path = "src/main.rs"

[dependencies]
ciri-term = { workspace = true }
ciri-layout = { path = "../ciri-layout" }
ciri-protocol = { workspace = true }
ciri-session = { workspace = true }
ciri-config = { workspace = true }
ciri-procinfo = { workspace = true }
rmp-serde = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
percent-encoding = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio", "query"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
# Connections are served via hyper directly (not `axum::serve`) so a
# `header_read_timeout` can reap stalled/idle pre-auth sockets — see
# `daemon::web::serve_web`.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSObjCRuntime", "NSString", "NSDate"] }

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
