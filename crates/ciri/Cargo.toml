[package]
name = "ciritty"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ciritty"
path = "src/main.rs"

[dependencies]
ciri-app = { workspace = true }
ciri-render = { workspace = true }
ciri-gpu = { workspace = true }
ciri-protocol = { workspace = true }
ciri-session = { path = "../ciri-session" }
ciri-layout = { path = "../ciri-layout" }
ciri-anim = { path = "../ciri-anim" }
ciri-motion = { workspace = true }
ciri-ui = { workspace = true }
ciri-input = { path = "../ciri-input" }
ciri-config = { workspace = true }
crossbeam-channel = { workspace = true }
rmp-serde = { workspace = true }
winit = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "color"] }
dialoguer = "0.11"
serde_json = "1"
arboard = { workspace = true }
unicode-width = "0.2"
notify = { workspace = true }
libc = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
taffy = { workspace = true }

[target.'cfg(unix)'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
