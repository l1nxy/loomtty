[package]
name = "loom-gpu"
version.workspace = true
edition.workspace = true

[features]
default = ["blade", "gl", "dx"]
blade = ["dep:blade-graphics", "dep:blade-macros"]
gl = ["dep:glow", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]
dx = ["dep:windows", "dep:raw-window-handle"]

[dependencies]
loom-render = { workspace = true }
loom-config = { path = "../loom-config" }
fontdb = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }

# blade backend
blade-graphics = { workspace = true, optional = true }
blade-macros = { workspace = true, optional = true }

# GL/EGL backend
glow = { version = "0.16", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
blade-graphics = { workspace = true }
blade-macros = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
# Host-side WGSL validation so shader syntax errors fail `cargo test`
# instead of panicking at first GPU-context init.
naga = { version = "25", features = ["wgsl-in"] }

# DX backend (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Threading",
    "Foundation_Numerics",
] }
