[package]
name = "loomtty"
version.workspace = true
edition.workspace = true

[[bin]]
name = "loomtty"
path = "src/main.rs"

[dependencies]
loom-app = { workspace = true }
loom-render = { workspace = true }
loom-gpu = { workspace = true }
loom-protocol = { workspace = true }
loom-session = { path = "../loom-session" }
loom-layout = { path = "../loom-layout" }
loom-anim = { path = "../loom-anim" }
loom-motion = { workspace = true }
loom-ui = { workspace = true }
loom-input = { path = "../loom-input" }
loom-config = { workspace = true }
crossbeam-channel = { workspace = true }
rmp-serde = { workspace = true }
winit = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "color"] }
dialoguer = "0.11"
serde_json = "1"
arboard = { workspace = true }
unicode-width = "0.2"
notify = { workspace = true }
libc = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
taffy = { workspace = true }
getrandom = "0.4.2"

[target.'cfg(unix)'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
