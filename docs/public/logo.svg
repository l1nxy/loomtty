<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1E1E20" />
                        <stop offset="100%" style="stop-color:#09090B" />
                    </linearGradient>
                    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00FBFF" />
                        <stop offset="100%" style="stop-color:#007AFF" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Icon Background -->
                <rect x="128" y="128" width="768" height="768" rx="180" fill="url(#bgGradient)" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

                <!-- The Prompt (>) -->
                <g filter="url(#glow)">
                    <!-- Base Shape -->
                    <path d="M360 340 L620 512 L360 684 L410 512 Z" fill="url(#primaryGradient)" />
                    <!-- Highlight Edge -->
                    <path d="M360 340 L620 512 L560 512 L360 380 Z" fill="white" opacity="0.3" />
                </g>

                <!-- Cursor (_) -->
                <rect x="620" y="630" width="130" height="50" rx="8" fill="white" opacity="0.9" />

                <!-- Subsurface Detail -->
                <circle cx="800" cy="224" r="40" fill="url(#primaryGradient)" opacity="0.1" />
            </svg>
