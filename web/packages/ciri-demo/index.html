<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ciritty — web demo</title>
    <!-- PWA: installable to the home screen, dark UI chrome. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ciritty" />
    <!-- Page + chrome styles live in @ciri/app/chrome.css, imported by src/main.ts. -->
  </head>
  <body>
    <div id="status" class="connecting">
      <span class="dot"></span>
      <span class="state">connecting…</span>
      <span class="url"></span>
      <span class="err"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
