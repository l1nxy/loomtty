<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ciritty</title>
    <!-- PWA: installable to the home screen, dark UI chrome. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ciritty" />
    <style>
      /* Page + chrome styles come from @ciri/app/chrome.css (imported in
         main.ts). Only the login gate is styled here: it must render
         correctly BEFORE that stylesheet loads, so each rule uses a
         literal fallback alongside the shared token. */
      #login {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px;
        background: var(--bg-app, #000);
        font-family: var(
          --font-mono,
          "JetBrains Mono",
          "Cascadia Mono",
          "SF Mono",
          Menlo,
          Consolas,
          monospace
        );
      }
      #login[hidden] {
        display: none;
      }
      .login-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(92vw, 360px);
        padding: 24px;
        background: var(--bg-chrome-strong, #1a1a1a);
        border: 1px solid var(--border, #333);
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      .login-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--fg-strong, #e7eef5);
      }
      .login-sub {
        font-size: 13px;
        color: var(--fg-muted, #9aa);
      }
      .login-input {
        min-height: 40px;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 14px;
        color: var(--fg, #d3d7cf);
        background: var(--bg-chip, #1f1f1f);
        border: 1px solid var(--border, #333);
        border-radius: 8px;
      }
      .login-input:focus-visible {
        outline: 2px solid var(--border-accent, #4d7fb3);
        outline-offset: 1px;
      }
      .login-btn {
        min-height: 40px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--fg-strong, #e7eef5);
        background: var(--bg-chip-current, #2a3f5a);
        border: 1px solid var(--border-accent, #4d7fb3);
        border-radius: 8px;
        cursor: pointer;
      }
      .login-btn:hover {
        background: #34507a;
      }
      .login-err {
        min-height: 1.2em;
        font-size: 12px;
        color: var(--fg-err, #ef2929);
      }
    </style>
  </head>
  <body>
    <div id="status" class="connecting" hidden>
      <span class="dot"></span>
      <span class="state">connecting…</span>
      <span class="url"></span>
      <span class="err"></span>
    </div>
    <div id="app"></div>
    <div id="login">
      <form class="login-card" id="login-form" autocomplete="on">
        <div class="login-title">ciritty</div>
        <div class="login-sub">Enter your access token to connect.</div>
        <input
          class="login-input"
          id="login-token"
          type="password"
          name="token"
          autocomplete="current-password"
          placeholder="access token"
          aria-label="access token"
        />
        <button class="login-btn" type="submit">Connect</button>
        <div class="login-err" id="login-err" role="alert"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
