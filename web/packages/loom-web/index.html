<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: the app owns zoom (pinch on the terminal resizes
         the font + grid); a page zoom would only misalign the chrome.
         interactive-widget: Android Chrome shrinks the layout viewport
         with the on-screen keyboard (iOS ignores it; LoomApp tracks
         visualViewport there). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>loomtty</title>
    <!-- PWA: installable to the home screen, dark UI chrome. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebebe8" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="loomtty" />
    <style>
      /* Page + chrome styles come from @loom/app/chrome.css (imported in
         main.ts). Only the login gate is styled here: it must render
         correctly BEFORE that stylesheet loads, so each rule uses a
         literal fallback alongside the shared token. */
      #login {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px;
        background: var(--bg-app, #000);
        font-family: var(
          --font-mono,
          "JetBrains Mono",
          "Cascadia Mono",
          "SF Mono",
          Menlo,
          Consolas,
          monospace
        );
      }
      #login[hidden] {
        display: none;
      }
      .login-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(92vw, 360px);
        padding: 24px;
        background: var(--bg-chrome-strong, #1a1a1a);
        border: 1px solid var(--border, #333);
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      .login-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--fg-strong, #e7eef5);
      }
      .login-sub {
        font-size: 13px;
        color: var(--fg-muted, #9aa);
      }
      .login-input {
        min-height: 40px;
        padding: 8px 12px;
        font-family: inherit;
        /* ≥16px so iOS doesn't zoom the page when the field is focused. */
        font-size: 16px;
        color: var(--fg, #d3d7cf);
        background: var(--bg-chip, #1f1f1f);
        border: 1px solid var(--border, #333);
        border-radius: 8px;
      }
      .login-input:focus-visible {
        outline: 2px solid var(--border-accent, #4d7fb3);
        outline-offset: 1px;
      }
      .login-btn {
        min-height: 40px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--fg-strong, #e7eef5);
        background: var(--bg-chip-current, #2a3f5a);
        border: 1px solid var(--border-accent, #4d7fb3);
        border-radius: 8px;
        cursor: pointer;
      }
      .login-btn:hover {
        background: #34507a;
      }
      /* Light OS theme: the login card follows it too (the shared
         chrome tokens aren't bound yet when this renders). */
      @media (prefers-color-scheme: light) {
        #login {
          background: #fbfbfa;
        }
        .login-card {
          background: #f2f2f0;
          border-color: #c6c6c0;
          box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        }
        .login-title {
          color: #000;
        }
        .login-sub {
          color: #5e5c64;
        }
        .login-input {
          color: #1e2124;
          background: #fff;
          border-color: #c6c6c0;
        }
        .login-btn {
          color: #000;
          background: #d5e4f8;
          border-color: #3584e4;
        }
        .login-btn:hover {
          background: #c3d8f4;
        }
      }
      .login-err {
        min-height: 1.2em;
        font-size: 12px;
        color: var(--fg-err, #ef2929);
      }
    </style>
  </head>
  <body>
    <div id="status" class="connecting" hidden>
      <span class="dot"></span>
      <span class="state">connecting…</span>
      <span class="url"></span>
      <span class="err"></span>
    </div>
    <div id="app"></div>
    <div id="login">
      <form class="login-card" id="login-form" autocomplete="on">
        <div class="login-title">loomtty</div>
        <div class="login-sub">Enter your access token to connect.</div>
        <input
          class="login-input"
          id="login-token"
          type="password"
          name="token"
          autocomplete="current-password"
          placeholder="access token"
          aria-label="access token"
        />
        <button class="login-btn" type="submit">Connect</button>
        <div class="login-err" id="login-err" role="alert"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
